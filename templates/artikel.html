    <h1>{{ titel }}</h1>
    <p class="lead">{{ intro }}</p>
    {{{ disclosureblok }}}
  </div>
</div>
<article class="wrap narrow article">
{{{ inhoud }}}
</article>

    <p>De samensteller rekent je hele systeem door in vier stappen — van koelkast tot accu.</p>
    <a class="btn" href="index.html">Stel je systeem samen</a>
  </div>
  <p class="bijgewerkt">{{ bijgewerkt }}</p>
