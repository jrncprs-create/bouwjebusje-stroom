name: Bouw en publiceer naar deploy-branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Site bouwen
        run: node build.js

      - name: .htaccess toevoegen (DirectoryIndex voor de submap)
        run: printf 'DirectoryIndex index.html index.php\n' > public/.htaccess

      - name: Publiceren naar deploy-branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./public
